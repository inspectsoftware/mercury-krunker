[package]
name = "latency"
version = "0.1.0"
license = "MIT"
edition = "2024"
publish = false
description = "Dev tool: input-to-screen latency of a Mercury window (SendInput + DXGI Desktop Duplication)"

[dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_System_Performance",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }
