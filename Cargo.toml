[package]
name = "mercury"
version = "0.2.0"
description = "Mercury Client: a Krunker client"
edition = "2024"
publish = false

# CEF's sandbox bootstrap.exe (shipped as mercury.exe) loads this DLL for every process.
[lib]
crate-type = ["cdylib"]

[dependencies]
# Exact pin: the bindings must match the CEF distribution's API hash.
cef = { version = "=156.6.0", default-features = false, features = ["sandbox"] }
base64 = "0.22"
serde_json = "1"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Cryptography",
    "Win32_System_Com",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Performance",
    "Win32_System_Power",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
# COM interfaces for the GPU process's DXGI hook (src/gpu_hook.rs). Its DLLs are loaded at runtime, never imported.
windows = { version = "0.62", features = [
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Security",
] }

[workspace]
members = ["xtask", "crates/obs-mercury-capture"]
