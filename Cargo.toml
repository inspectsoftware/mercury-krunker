[package]
name = "mercury"
version = "0.2.0"
description = "Mercury Client: a Krunker client"
edition = "2024"
publish = false

# CEF's sandbox bootstrap.exe (shipped as mercury.exe) loads this DLL for every process.
[lib]
crate-type = ["cdylib"]

[dependencies]
# Exact pin: the bindings must match the CEF distribution's API hash.
cef = { version = "=156.6.0", default-features = false, features = ["sandbox"] }
base64 = "0.22"
serde_json = "1"
# WinRT media session (now-playing overlay, media.rs).
windows = { version = "0.62", features = ["Media_Control"] }
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Networking_WinHttp",
    "Win32_Security_Cryptography",
    "Win32_System_Com",
    "Win32_System_Com_Urlmon",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
lto = "thin"
codegen-units = 1
# Line tables keep panic locations in the crash log; the bundle step also expects mercury.pdb.
debug = "line-tables-only"

[workspace]
members = ["xtask", "tools/latency"]
