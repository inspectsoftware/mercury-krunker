# Push a tag vX.Y.Z (matching Cargo.toml's version) to build the installer and publish it as a GitHub release.
# The client's auto-updater (src/update.rs) offers the latest release's installer.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  installer:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@stable
      - uses: ilammy/msvc-dev-cmd@v1
      - name: The tag must match Cargo.toml
        shell: pwsh
        run: |
          $v = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          if ("v$v" -ne "${{ github.ref_name }}") { throw "tag ${{ github.ref_name }} does not match Cargo.toml $v" }
      - name: Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Build the installer
        run: cargo xtask installer
      - name: Publish the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $notes = "docs/releases/${{ github.ref_name }}.md"
          $notesArgs = if (Test-Path $notes) { @("--notes-file", $notes) } else { @("--generate-notes") }
          # Every release starts as a pre-release: clients update only to GitHub's latest full release, so nobody gets
          # a build before it was tried. Promote it with: gh release edit <tag> --prerelease=false --latest
          gh release create "${{ github.ref_name }}" (Get-ChildItem target/installer/*.exe).FullName --title "Mercury Client ${{ github.ref_name }}" --prerelease @notesArgs
